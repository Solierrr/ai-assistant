openapi: 3.0.3
info:
  title: Solaria — ai-assistant
  description: Contrato HTTP deste serviço. Use um access token emitido pelo api-auth nas operações com bearerAuth.
    URLs e credenciais são configuradas no cliente HTTP; este arquivo não contém valores privados.
  version: 0.1.0
servers:
- url: http://localhost:{port}
  description: Execução local; ajuste a porta ou substitua o servidor no cliente HTTP.
  variables:
    port:
      default: '8000'
paths:
  /chat:
    post:
      tags:
      - chat
      summary: Enviar mensagem ao assistente
      description: Processa a mensagem no fluxo do assistente e devolve a resposta na mesma chamada (sem fila).
      operationId: conversar_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Validation Error (VALIDATION_ERROR), com errors[{field, message}].
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Cabecalho Authorization ausente ou fora do formato Bearer, ou access token invalido ou expirado (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Validacao do access token nao configurada fora do ambiente LOCAL.
      security:
      - bearerAuth: []
  /health:
    get:
      summary: Health
      description: Informa se as configurações obrigatórias foram fornecidas.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
      security: []
components:
  schemas:
    ChatRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
          example: b2b-empresa-42
        message:
          type: string
          minLength: 1
          title: Message
          example: Preciso de um instalador em SP
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: O que o cliente envia no POST /chat.
    ChatResponse:
      properties:
        response:
          type: string
          title: Response
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
        messenger_conversation_id:
          type: string
          nullable: true
          title: Messenger Conversation Id
          description: Id da conversa no api-messenger; e o conversationId do POST /messaging/nps.
      type: object
      required:
      - response
      title: ChatResponse
      description: O que a API devolve no POST /chat.
    ProblemDetail:
      type: object
      title: ProblemDetail
      description: Corpo de todo erro (application/problem+json). Sem campo type.
      required:
      - title
      - status
      - detail
      - errorCode
      - timestamp
      properties:
        title:
          type: string
          description: Reason phrase do status.
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: Texto para humanos; o cliente decide pelo errorCode.
        instance:
          type: string
          example: /chat
        errorCode:
          type: string
          example: VALIDATION_ERROR
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          description: Só aparece quando há span ativo.
    ValidationProblem:
      title: ValidationProblem
      allOf:
      - $ref: '#/components/schemas/ProblemDetail'
      - type: object
        properties:
          errors:
            type: array
            items:
              type: object
              properties:
                field:
                  type: string
                  nullable: true
                  example: items.0.qty
                message:
                  type: string
                  example: Field required
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de usuário emitido pelo api-auth.
