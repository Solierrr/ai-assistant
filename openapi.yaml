openapi: 3.1.0
info:
  title: Solaria — ai-assistant
  description: 'Assistente virtual da plataforma para quem procura soluções de energia
    solar: conversa com a pessoa, identifica a necessidade e ajuda a encontrar placas
    solares, itens de fixação, profissionais e empresas adequados a cada caso. Autentique
    com o JWT emitido pelo api-auth (bearerAuth). O protocolo A2A (Agent Card em /.well-known/agent-card.json
    e JSON-RPC em /a2a) não faz parte deste contrato.'
  contact:
    name: Solaria
    url: https://github.com/Solierrr
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 3.1.2 # x-release-please-version
servers:
- url: https://ai-assistant-5ljd.onrender.com
  description: QA
- url: http://localhost:8000
  description: Local
paths:
  /chat:
    post:
      tags:
      - Conversa
      summary: Envia uma mensagem ao assistente e devolve a resposta do turno
      description: 'Roda um turno do assistente com o JWT do usuário. Recusa do guardrail,
        fallback e falha de ferramenta não são erro HTTP: voltam 200 com outcome e
        reason. Grava a mensagem do usuário e a do assistente no api-messenger.'
      operationId: sendChatMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: JWT ausente ou malformado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearerAuth: []
      x-error-codes:
      - UNAUTHENTICATED
      - VALIDATION_FAILED
      - INTERNAL_ERROR
  /health:
    get:
      tags:
      - Saúde
      summary: Indica se o processo está vivo
      description: Responde UP com a versão do release, sem consultar dependências.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security: []
      x-error-codes:
      - INTERNAL_ERROR
  /ready:
    get:
      tags:
      - Saúde
      summary: Indica se o serviço está pronto para atender
      description: Confere o MongoDB (checkpointer da conversa e memória de longo
        prazo). Responde 503 com status DOWN quando ele não responde em 2 segundos.
        Os provedores de LLM ficam de fora porque há fallback entre eles.
      operationId: getReady
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security: []
      x-error-codes:
      - INTERNAL_ERROR
components:
  schemas:
    ChatRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
          examples:
          - b2b-empresa-42
        message:
          type: string
          minLength: 1
          title: Message
          examples:
          - Preciso de um instalador em SP
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: O que o cliente envia no POST /chat.
    ChatResponse:
      properties:
        response:
          type: string
          title: Response
        outcome:
          $ref: '#/components/schemas/TurnOutcome'
          description: 'Resultado do turno: ANSWERED (respondeu), REFUSED (guardrail
            recusou), DEGRADED (houve fallback) ou TOOL_FAILED (uma ferramenta falhou
            e a resposta saiu sem ela).'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Código do catálogo de erros; presente quando outcome não é
            ANSWERED.
          examples:
          - OUT_OF_SCOPE
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
        messenger_conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Messenger Conversation Id
          description: Id da conversa no api-messenger; é o conversationId do POST
            /messaging/nps.
      type: object
      required:
      - response
      - outcome
      title: ChatResponse
      description: O que a API devolve no POST /chat.
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
          examples:
          - UP
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          examples:
          - 3.1.2
      type: object
      required:
      - status
      title: HealthStatus
    TurnOutcome:
      type: string
      enum:
      - ANSWERED
      - REFUSED
      - DEGRADED
      - TOOL_FAILED
      title: TurnOutcome
    ProblemFieldError:
      description: Campo inválido num erro de validação.
      properties:
        field:
          examples:
          - message
          title: Field
          type: string
        errorCode:
          examples:
          - VALIDATION_FAILED
          title: Errorcode
          type: string
        detail:
          examples:
          - String should have at least 1 character
          title: Detail
          type: string
      required:
      - field
      - errorCode
      - detail
      title: ProblemFieldError
      type: object
    ProblemDetail:
      description: Corpo de todo erro HTTP (application/problem+json), no contrato
        de erro da Solaria.
      properties:
        type:
          examples:
          - about:blank
          title: Type
          type: string
        title:
          examples:
          - UNAUTHENTICATED
          title: Title
          type: string
        status:
          examples:
          - 401
          title: Status
          type: integer
        errorCode:
          description: Código estável do catálogo de erros.
          examples:
          - UNAUTHENTICATED
          title: Errorcode
          type: string
        detail:
          description: Explicação para quem depura; o front não exibe.
          examples:
          - Authorization header deve ser 'Bearer <token>'
          title: Detail
          type: string
        instance:
          examples:
          - /chat
          title: Instance
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        traceId:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Traceid
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemFieldError'
            type: array
          - type: 'null'
          default: null
          description: Presente só em erros de validação.
          title: Errors
      required:
      - type
      - title
      - status
      - errorCode
      - detail
      - instance
      - timestamp
      title: ProblemDetail
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Conversa
  description: Turnos de conversa com o assistente.
- name: Saúde
  description: Estado do processo e das dependências.
security:
- bearerAuth: []
