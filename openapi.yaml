openapi: 3.0.3
info:
  title: Solaria — ai-assistant
  description: Contrato HTTP deste serviço. Use um access token emitido pelo api-auth nas operações com bearerAuth.
    URLs e credenciais são configuradas no cliente HTTP; este arquivo não contém valores privados.
  version: 0.1.0
servers:
- url: http://localhost:{port}
  description: Execução local; ajuste a porta ou substitua o servidor no cliente HTTP.
  variables:
    port:
      default: '8000'
paths:
  /chat:
    post:
      tags:
      - chat
      summary: Enviar mensagem ao assistente
      description: Processa a mensagem no fluxo do assistente e devolve a resposta na mesma chamada (sem fila).
      operationId: conversar_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Cabecalho Authorization ausente ou fora do formato Bearer, ou access token invalido ou expirado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Validacao do access token nao configurada fora do ambiente LOCAL.
      security:
      - bearerAuth: []
  /health:
    get:
      summary: Health
      description: Informa se as configurações obrigatórias foram fornecidas.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
      security: []
components:
  schemas:
    ChatRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
          example: b2b-empresa-42
        message:
          type: string
          minLength: 1
          title: Message
          example: Preciso de um instalador em SP
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: O que o cliente envia no POST /chat.
    ChatResponse:
      properties:
        response:
          type: string
          title: Response
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
        messenger_conversation_id:
          type: string
          nullable: true
          title: Messenger Conversation Id
          description: Id da conversa no api-messenger; e o conversationId do POST /messaging/nps.
      type: object
      required:
      - response
      title: ChatResponse
      description: O que a API devolve no POST /chat.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de usuário emitido pelo api-auth.
